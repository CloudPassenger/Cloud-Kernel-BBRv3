name: Build Cloud Kernel Packages

on:
  repository_dispatch:
    types: [trigger-x86_64-build, trigger-arm64-build]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version"
        required: true
        default: "6.12.30"
        type: string
      arch:
        description: "Target architecture"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - arm64
      skip_cache:
        description: "Skip compiler caches"
        required: false
        default: false
        type: boolean
      diagnostic_build:
        description: "Enable verbose diagnostics for DEB, RPM, and APK builds"
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    name: Prepare Build Parameters
    runs-on: ubuntu-24.04
    outputs:
      kernel_version: ${{ steps.parameters.outputs.KERNEL_VERSION }}
      kernel_series: ${{ steps.parameters.outputs.KERNEL_SERIES }}
      kernel_major_version: ${{ steps.parameters.outputs.KERNEL_MAJOR_VERSION }}
      skip_cache: ${{ steps.parameters.outputs.SKIP_CACHE }}
      diagnostic_build: ${{ steps.parameters.outputs.DIAGNOSTIC_BUILD }}
      arch: ${{ steps.parameters.outputs.ARCH }}
      debian_arch: ${{ steps.parameters.outputs.DEBIAN_ARCH }}
      rpm_arch: ${{ steps.parameters.outputs.RPM_ARCH }}
      alpine_arch: ${{ steps.parameters.outputs.ALPINE_ARCH }}
      runner: ${{ steps.parameters.outputs.RUNNER }}
      tag_suffix: ${{ steps.parameters.outputs.TAG_SUFFIX }}
    steps:
      - name: Prepare Build Parameters
        id: parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DISPATCH_VERSION: ${{ github.event.client_payload.kernel_version }}
          DISPATCH_DIAGNOSTIC: ${{ github.event.client_payload.diagnostic_build }}
          INPUT_VERSION: ${{ inputs.kernel_version }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_SKIP_CACHE: ${{ inputs.skip_cache }}
          INPUT_DIAGNOSTIC: ${{ inputs.diagnostic_build }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            KERNEL_VERSION="$DISPATCH_VERSION"
            case "$EVENT_ACTION" in
              trigger-x86_64-build) ARCH=x86_64 ;;
              trigger-arm64-build) ARCH=arm64 ;;
              *)
                echo "Unknown repository_dispatch event type: $EVENT_ACTION" >&2
                exit 1
                ;;
            esac
            SKIP_CACHE=false
            DIAGNOSTIC_BUILD=${DISPATCH_DIAGNOSTIC:-false}
          else
            KERNEL_VERSION="$INPUT_VERSION"
            ARCH="$INPUT_ARCH"
            SKIP_CACHE="$INPUT_SKIP_CACHE"
            DIAGNOSTIC_BUILD="$INPUT_DIAGNOSTIC"
          fi

          if ! [[ "$KERNEL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid kernel version: $KERNEL_VERSION" >&2
            exit 1
          fi

          case "$DIAGNOSTIC_BUILD" in
            true|false) ;;
            *)
              echo "Invalid diagnostic build value: $DIAGNOSTIC_BUILD" >&2
              exit 1
              ;;
          esac

          case "$SKIP_CACHE" in
            true|false) ;;
            *)
              echo "Invalid skip cache value: $SKIP_CACHE" >&2
              exit 1
              ;;
          esac

          case "$ARCH" in
            x86_64)
              DEBIAN_ARCH=amd64
              RPM_ARCH=x86_64
              ALPINE_ARCH=x86_64
              RUNNER=ubuntu-24.04
              TAG_SUFFIX=""
              ;;
            arm64)
              DEBIAN_ARCH=arm64
              RPM_ARCH=aarch64
              ALPINE_ARCH=aarch64
              RUNNER=ubuntu-24.04-arm
              TAG_SUFFIX=-arm64
              ;;
            *)
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac

          KERNEL_SERIES=${KERNEL_VERSION%.*}
          KERNEL_MAJOR_VERSION=${KERNEL_VERSION%%.*}

          {
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "KERNEL_SERIES=$KERNEL_SERIES"
            echo "KERNEL_MAJOR_VERSION=$KERNEL_MAJOR_VERSION"
            echo "SKIP_CACHE=$SKIP_CACHE"
            echo "DIAGNOSTIC_BUILD=$DIAGNOSTIC_BUILD"
            echo "ARCH=$ARCH"
            echo "DEBIAN_ARCH=$DEBIAN_ARCH"
            echo "RPM_ARCH=$RPM_ARCH"
            echo "ALPINE_ARCH=$ALPINE_ARCH"
            echo "RUNNER=$RUNNER"
            echo "TAG_SUFFIX=$TAG_SUFFIX"
          } >> "$GITHUB_OUTPUT"

  prepare-source:
    name: Prepare Patched Source for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: prepare
    steps:
      - name: Install Source Preparation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git jq patch quilt bison bc flex rsync cmake pkg-config \
            libncurses-dev libdw-dev libelf-dev zlib1g-dev dpkg-dev xz-utils zstd

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Build and Install Pahole
        run: sudo bash .github/scripts/build_pahole.sh "$RUNNER_TEMP/dwarves-v1.31"

      - name: Prepare Shared Kernel Source
        run: |
          bash .github/scripts/prepare_kernel_source.sh \
            "${{ needs.prepare.outputs.kernel_version }}" \
            "${{ needs.prepare.outputs.arch }}" \
            "$RUNNER_TEMP/kernel-work"

      - name: Create Prepared Source Archive
        run: |
          tar --zstd -cf prepared-kernel.tar.zst \
            -C "$RUNNER_TEMP/kernel-work" linux
          cp "$RUNNER_TEMP/kernel-work/build-manifest.json" .
          cp "$RUNNER_TEMP/kernel-work/linux/.config" \
            "linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}.config"

      - name: Upload Prepared Source
        uses: actions/upload-artifact@v7
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: |
            prepared-kernel.tar.zst
            build-manifest.json
            linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}.config
          if-no-files-found: error
          retention-days: 3

      - name: Upload Release Manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ needs.prepare.outputs.arch }}
          path: build-manifest.json
          if-no-files-found: error

  build-deb:
    name: Build Debian Packages for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source]
    outputs:
      build_time: ${{ steps.build_time.outputs.BUILD_TIMESTAMP }}
    steps:
      - name: Install Debian Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache cmake curl git patch jq openssl pkg-config quilt \
            libncurses-dev libssl-dev libelf-dev libdw-dev zlib1g-dev libudev-dev \
            libpci-dev libcap-dev libpcre2-dev libcurl4-openssl-dev bison bc flex \
            rsync debhelper lz4 zstd dpkg-dev fakeroot kmod cpio xz-utils

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Prepared Source
        uses: actions/download-artifact@v8
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: prepared

      - name: Extract Prepared Source
        run: tar --zstd -xf prepared/prepared-kernel.tar.zst

      - name: Build and Install Pahole
        run: sudo bash .github/scripts/build_pahole.sh "$RUNNER_TEMP/dwarves-v1.31"

      - name: Restore Debian Compiler Cache
        if: needs.prepare.outputs.skip_cache != 'true'
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: deb-${{ needs.prepare.outputs.kernel_series }}-${{ needs.prepare.outputs.debian_arch }}

      - name: Verify Prepared Configuration
        run: |
          if ! grep -q '^CONFIG_DEBUG_INFO_BTF=y$' linux/.config; then
            echo "CONFIG_DEBUG_INFO_BTF was not selected" >&2
            exit 1
          fi
          if grep -q '^CONFIG_DEBUG_INFO_NONE=y$' linux/.config; then
            echo "CONFIG_DEBUG_INFO_NONE was unexpectedly selected" >&2
            exit 1
          fi
          if ! grep -q '^CONFIG_LOCALVERSION=""$' linux/.config; then
            echo "CONFIG_LOCALVERSION must remain empty for this migration" >&2
            exit 1
          fi

      - name: Record Diagnostic Environment
        if: needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          mkdir -p kernel-build-diagnostics
          {
            date -Is
            uname -a
            echo "CPU count: $(nproc)"
            free -h
            df -h
            ulimit -a
            pahole --version
            gcc --version
            ld --version
          } > kernel-build-diagnostics/environment.log 2>&1
          grep -E '^(CONFIG_(DEBUG_INFO|DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES|PAHOLE_VERSION|BPF_SYSCALL|WERROR|LOCALVERSION)=|# CONFIG_(DEBUG_INFO_BTF|DEBUG_INFO_BTF_MODULES) is not set)' \
            linux/.config > kernel-build-diagnostics/kernel-config-summary.log || true

      - name: Build Debian Kernel Packages
        env:
          KBUILD_BUILD_USER: cloudpassenger
          KBUILD_BUILD_HOST: github-actions
          KBUILD_BUILD_TIMESTAMP: ""
          KDEB_COMPRESS: xz
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          cd linux
          if [ "$DIAGNOSTIC_BUILD" = "true" ]; then
            DIAGNOSTIC_DIR=../kernel-build-diagnostics
            set +e
            make V=1 -j "$(nproc)" CC="ccache gcc" HOSTCC="ccache gcc" bindeb-pkg \
              > "$DIAGNOSTIC_DIR/build.log" 2>&1
            BUILD_STATUS=$?
            set -e
            if [ "$BUILD_STATUS" -ne 0 ]; then
              grep -nE 'BTF|pahole|resolve_btfids|FAILED|Failed|Error [0-9]+|Killed|out of memory' \
                "$DIAGNOSTIC_DIR/build.log" | tail -n 200 || true
              tail -n 500 "$DIAGNOSTIC_DIR/build.log"
              exit "$BUILD_STATUS"
            fi
          else
            make -j "$(nproc)" CC="ccache gcc" HOSTCC="ccache gcc" bindeb-pkg
          fi
          cp .config "../linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}.config"

      - name: Collect Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          mkdir -p kernel-build-diagnostics
          cp linux/.config kernel-build-diagnostics/final.config 2>/dev/null || true
          cp linux/include/config/auto.conf kernel-build-diagnostics/auto.conf 2>/dev/null || true
          cp linux/scripts/Makefile.btf kernel-build-diagnostics/Makefile.btf 2>/dev/null || true
          cp linux/scripts/link-vmlinux.sh kernel-build-diagnostics/link-vmlinux.sh 2>/dev/null || true
          ccache --show-stats > kernel-build-diagnostics/ccache.log 2>&1 || true
          if [ -f kernel-build-diagnostics/build.log ]; then
            zstd -T0 -10 --rm kernel-build-diagnostics/build.log
          fi

      - name: Upload Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Debian Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ needs.prepare.outputs.arch }}
          path: |
            *.deb
            *.changes
            *.buildinfo
            *.config
          if-no-files-found: error

      - name: Record Build Time
        id: build_time
        run: |
          BUILD_TIMESTAMP=$(date -Is)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"

  build-rpm:
    name: Build ${{ matrix.name }} RPMs for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fedora43
            name: Fedora 43
            image: fedora:43
          - id: fedora44
            name: Fedora 44
            image: fedora:44
          - id: el9
            name: Enterprise Linux 9
            image: rockylinux:9
          - id: el10
            name: Enterprise Linux 10
            image: rockylinux:10
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Prepared Source
        uses: actions/download-artifact@v8
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: prepared

      - name: Restore RPM Compiler Cache
        if: needs.prepare.outputs.skip_cache != 'true'
        uses: actions/cache@v5
        with:
          path: .ccache/rpm/${{ matrix.id }}-${{ needs.prepare.outputs.arch }}
          key: rpm-${{ matrix.id }}-${{ needs.prepare.outputs.kernel_series }}-${{ needs.prepare.outputs.arch }}-${{ github.sha }}
          restore-keys: |
            rpm-${{ matrix.id }}-${{ needs.prepare.outputs.kernel_series }}-${{ needs.prepare.outputs.arch }}-

      - name: Build RPM Packages
        env:
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          run_rpm_build() {
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              --env CCACHE_DIR="/workspace/.ccache/rpm/${{ matrix.id }}-${{ needs.prepare.outputs.arch }}" \
              --env DIAGNOSTIC_BUILD="$DIAGNOSTIC_BUILD" \
              "${{ matrix.image }}" \
              bash .github/scripts/build_rpm.sh \
                "${{ needs.prepare.outputs.kernel_version }}" \
                "${{ needs.prepare.outputs.arch }}" \
                "${{ matrix.id }}" \
                prepared/prepared-kernel.tar.zst \
                "dist/rpm/${{ matrix.id }}"
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_rpm_build
            exit 0
          fi

          diagnostic_dir="kernel-build-diagnostics/rpm-${{ matrix.id }}"
          mkdir -p "$diagnostic_dir"
          set +e
          run_rpm_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::group::RPM build diagnostics"
            grep -nEi 'BTF|pahole|fatal|error:|failed|killed|no space|undefined reference' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            echo "::endgroup::"
            echo "::group::Last 500 RPM build log lines"
            tail -n 500 "$diagnostic_dir/build.log"
            echo "::endgroup::"
            exit "$build_status"
          fi
      - name: Collect RPM Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          diagnostic_dir="kernel-build-diagnostics/rpm-${{ matrix.id }}"
          mkdir -p "$diagnostic_dir"
          {
            date -Is
            uname -a
            echo "CPU count: $(nproc)"
            free -h
            df -h
            docker version
            docker image inspect "${{ matrix.image }}" --format '{{json .RepoDigests}}' || true
          } > "$diagnostic_dir/environment.log" 2>&1
          cp prepared/build-manifest.json "$diagnostic_dir/" 2>/dev/null || true
          cp packaging/rpm/kernel-cloud-bbrv3.spec "$diagnostic_dir/" 2>/dev/null || true
          cp ".build/rpm/${{ matrix.id }}-${{ needs.prepare.outputs.arch }}/linux/.config" \
            "$diagnostic_dir/final.config" 2>/dev/null || true
          cp ".build/rpm/${{ matrix.id }}-${{ needs.prepare.outputs.arch }}/rpmbuild.log" \
            "$diagnostic_dir/rpmbuild.log" 2>/dev/null || true
          for log in "$diagnostic_dir"/*.log; do
            [ -f "$log" ] || continue
            gzip -9 -f "$log"
          done

      - name: Upload RPM Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-rpm-${{ matrix.id }}-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/rpm-${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 7


      - name: Upload RPM Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-rpm-${{ matrix.id }}-${{ needs.prepare.outputs.arch }}
          path: dist/rpm/${{ matrix.id }}/*.rpm
          if-no-files-found: error

  build-apk:
    name: Build Alpine 3.24 APKs for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source]
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Prepared Source
        uses: actions/download-artifact@v8
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: prepared

      - name: Restore Alpine Compiler Cache
        if: needs.prepare.outputs.skip_cache != 'true'
        uses: actions/cache@v5
        with:
          path: .ccache/apk/alpine3.24-${{ needs.prepare.outputs.arch }}
          key: apk-alpine3.24-${{ needs.prepare.outputs.kernel_series }}-${{ needs.prepare.outputs.arch }}-${{ github.sha }}
          restore-keys: |
            apk-alpine3.24-${{ needs.prepare.outputs.kernel_series }}-${{ needs.prepare.outputs.arch }}-

      - name: Build APK Packages
        env:
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          run_apk_build() {
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              --env CCACHE_DIR="/workspace/.ccache/apk/alpine3.24-${{ needs.prepare.outputs.arch }}" \
              --env DIAGNOSTIC_BUILD="$DIAGNOSTIC_BUILD" \
              alpine:3.24 \
              sh -c 'apk add --no-cache bash coreutils && exec bash .github/scripts/build_apk.sh "$@"' -- \
                "${{ needs.prepare.outputs.kernel_version }}" \
                "${{ needs.prepare.outputs.arch }}" \
                alpine3.24 \
                prepared/prepared-kernel.tar.zst \
                dist/apk/alpine3.24
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_apk_build
            exit 0
          fi

          diagnostic_dir="kernel-build-diagnostics/apk-alpine3.24"
          mkdir -p "$diagnostic_dir"
          set +e
          run_apk_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::group::APK build diagnostics"
            grep -nEi 'BTF|pahole|fatal|error:|failed|killed|no space|undefined reference|untrusted' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            echo "::endgroup::"
            echo "::group::Last 500 APK build log lines"
            tail -n 500 "$diagnostic_dir/build.log"
            echo "::endgroup::"
            exit "$build_status"
          fi
      - name: Collect APK Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          diagnostic_dir="kernel-build-diagnostics/apk-alpine3.24"
          mkdir -p "$diagnostic_dir"
          {
            date -Is
            uname -a
            echo "CPU count: $(nproc)"
            free -h
            df -h
            docker version
            docker image inspect alpine:3.24 --format '{{json .RepoDigests}}' || true
          } > "$diagnostic_dir/environment.log" 2>&1
          cp prepared/build-manifest.json "$diagnostic_dir/" 2>/dev/null || true
          cp packaging/apk/APKBUILD.in "$diagnostic_dir/" 2>/dev/null || true
          cp ".build/apk/alpine3.24-${{ needs.prepare.outputs.arch }}/aports/testing/linux-cloud-bbrv3/APKBUILD" \
            "$diagnostic_dir/generated.APKBUILD" 2>/dev/null || true
          cp ".build/apk/alpine3.24-${{ needs.prepare.outputs.arch }}/aports/testing/linux-cloud-bbrv3/src/linux/.config" \
            "$diagnostic_dir/final.config" 2>/dev/null || true
          for log in "$diagnostic_dir"/*.log; do
            [ -f "$log" ] || continue
            gzip -9 -f "$log"
          done

      - name: Upload APK Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-apk-alpine3.24-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/apk-alpine3.24/
          if-no-files-found: warn
          retention-days: 7


      - name: Upload APK Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-alpine3.24-${{ needs.prepare.outputs.arch }}
          path: |
            dist/apk/alpine3.24/*.apk
            dist/apk/alpine3.24/*.rsa.pub
          if-no-files-found: error

  create-release:
    name: Create Multi-Format Release
    needs: [prepare, build-deb, build-rpm, build-apk]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ needs.prepare.outputs.arch }}
          path: release-assets
          merge-multiple: true

      - name: Remove Debian Debug Package
        run: find release-assets -type f -name 'linux-image-*-dbg_*.deb' -delete

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.kernel_version }}${{ needs.prepare.outputs.tag_suffix }}
          name: Cloud Kernel ${{ needs.prepare.outputs.kernel_version }} with BBRv3 (${{ needs.prepare.outputs.arch }})
          body: |
            ## English

            **Kernel version:** `${{ needs.prepare.outputs.kernel_version }}`

            **Build time:** `${{ needs.build-deb.outputs.build_time }}`

            **Build information:**
            - **Architecture:** `${{ needs.prepare.outputs.arch }}`
            - **Kernel type:** `cloud`
            - **Package targets:** Debian/Ubuntu `.deb`, Fedora 43/44 `.rpm`, Enterprise Linux 9/10 `.rpm`, Alpine Linux 3.24 `.apk`
            - **Applied patches:**
              - `Debian Patches Collection` (from [kernel-team/linux](https://salsa.debian.org/kernel-team/linux/))
              - `BBR V3` (from [xanmod/linux-patches](https://gitlab.com/xanmod/linux-patches))
              - `BBRPlus` (modified from [UJX6N/bbrplus-6.x_stable](https://github.com/UJX6N/bbrplus-6.x_stable))
              - `TCP Brutal` (from [apernet/tcp-brutal](https://github.com/apernet/tcp-brutal))

            **Important:** Secure Boot is not currently supported. Keep the distribution kernel installed as a recovery option.

            ```bash
            # Debian / Ubuntu
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb

            # Fedora / Enterprise Linux
            sudo dnf install ./kernel-cloud-bbrv3-[0-9]*.rpm ./kernel-cloud-bbrv3-devel-*.rpm

            # Alpine Linux
            sudo cp ./*.rsa.pub /etc/apk/keys/
            sudo apk add ./linux-cloud-bbrv3-[0-9]*.apk ./linux-cloud-bbrv3-dev-*.apk
            ```

            ---

            ## 中文

            **内核版本：** `${{ needs.prepare.outputs.kernel_version }}`

            **构建时间：** `${{ needs.build-deb.outputs.build_time }}`

            **构建信息：**
            - **架构：** `${{ needs.prepare.outputs.arch }}`
            - **内核类型：** `cloud`
            - **软件包目标：** Debian/Ubuntu `.deb`、Fedora 43/44 `.rpm`、Enterprise Linux 9/10 `.rpm`、Alpine Linux 3.24 `.apk`
            - **应用补丁：**
              - `Debian 补丁集合`（来自 [kernel-team/linux](https://salsa.debian.org/kernel-team/linux/)）
              - `BBR V3`（来自 [xanmod/linux-patches](https://gitlab.com/xanmod/linux-patches)）
              - `BBRPlus`（修改自 [UJX6N/bbrplus-6.x_stable](https://github.com/UJX6N/bbrplus-6.x_stable)）
              - `TCP Brutal`（来自 [apernet/tcp-brutal](https://github.com/apernet/tcp-brutal)）

            **重要提示：** 当前不支持 Secure Boot。请保留发行版原有内核作为恢复选项。

            ```bash
            # Debian / Ubuntu
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb

            # Fedora / Enterprise Linux
            sudo dnf install ./kernel-cloud-bbrv3-[0-9]*.rpm ./kernel-cloud-bbrv3-devel-*.rpm

            # Alpine Linux
            sudo cp ./*.rsa.pub /etc/apk/keys/
            sudo apk add ./linux-cloud-bbrv3-[0-9]*.apk ./linux-cloud-bbrv3-dev-*.apk
            ```
