name: Build Debian Kernel

on:
  repository_dispatch:
    types: [trigger-x86_64-build, trigger-arm64-build]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version"
        required: true
        default: "6.12.30"
        type: string
      arch:
        description: "Target architecture"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - arm64
      skip_cache:
        description: "Skip Cache"
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    name: Prepare Build Parameters
    runs-on: ubuntu-24.04
    outputs:
      kernel_version: ${{ steps.prepare_build_parameters.outputs.KERNEL_VERSION }}
      kernel_minor_version: ${{ steps.prepare_build_parameters.outputs.KERNEL_MINOR_VERSION }}
      kernel_major_version: ${{ steps.prepare_build_parameters.outputs.KERNEL_MAJOR_VERSION }}
      skip_cache: ${{ steps.prepare_build_parameters.outputs.SKIP_CACHE }}
      arch: ${{ steps.prepare_build_parameters.outputs.ARCH }}
      debian_arch: ${{ steps.prepare_build_parameters.outputs.DEBIAN_ARCH }}
      runner: ${{ steps.prepare_build_parameters.outputs.RUNNER }}
      tag_suffix: ${{ steps.prepare_build_parameters.outputs.TAG_SUFFIX }}
    steps:
      - name: Prepare Build Parameters
        id: prepare_build_parameters
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            KERNEL_VERSION="${{ github.event.client_payload.kernel_version }}"
            case "${{ github.event.action }}" in
              trigger-x86_64-build) ARCH=x86_64 ;;
              trigger-arm64-build) ARCH=arm64 ;;
              *)
                echo "❌ Unknown repository_dispatch event type: ${{ github.event.action }}"
                exit 1
                ;;
            esac
            SKIP_CACHE=false
          else
            KERNEL_VERSION="${{ inputs.kernel_version }}"
            ARCH="${{ inputs.arch }}"
            SKIP_CACHE="${{ inputs.skip_cache }}" || SKIP_CACHE=false
          fi
          KERNEL_MINOR_VERSION=$(echo "$KERNEL_VERSION" | cut -d '.' -f 2)
          KERNEL_MAJOR_VERSION=$(echo "$KERNEL_VERSION" | cut -d '.' -f 1)
          if [ -z "$KERNEL_VERSION" ]; then
            echo "❌ Failed to get kernel version"
            exit 1
          fi
          case "$ARCH" in
            x86_64)
              DEBIAN_ARCH=amd64
              RUNNER=ubuntu-24.04
              TAG_SUFFIX=""
              ;;
            arm64)
              DEBIAN_ARCH=arm64
              RUNNER=ubuntu-24.04-arm
              TAG_SUFFIX="-arm64"
              ;;
            *)
              echo "❌ Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac
          echo "✅ Using kernel version: $KERNEL_VERSION"
          echo "✅ Using kernel minor version: $KERNEL_MINOR_VERSION"
          echo "✅ Using kernel major version: $KERNEL_MAJOR_VERSION"
          echo "✅ Using architecture: $ARCH (debianarch: $DEBIAN_ARCH, runner: $RUNNER)"
          echo "✅ Using skip cache: $SKIP_CACHE"
          {
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "KERNEL_MINOR_VERSION=$KERNEL_MINOR_VERSION"
            echo "KERNEL_MAJOR_VERSION=$KERNEL_MAJOR_VERSION"
            echo "SKIP_CACHE=$SKIP_CACHE"
            echo "ARCH=$ARCH"
            echo "DEBIAN_ARCH=$DEBIAN_ARCH"
            echo "RUNNER=$RUNNER"
            echo "TAG_SUFFIX=$TAG_SUFFIX"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build Debian Kernel Package for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: prepare
    outputs:
      kernel_version: ${{ needs.prepare.outputs.kernel_version }}
      build_time: ${{ steps.get_build_time.outputs.BUILD_TIMESTAMP }}
    steps:
      - name: Update and install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl git patch jq openssl pkg-config quilt \
            libncurses-dev libssl-dev libelf-dev libdw-dev zlib1g-dev libudev-dev libpci-dev libcap-dev libpcre2-dev libcurl4-openssl-dev \
            bison bc flex rsync debhelper lz4 zstd dpkg-dev fakeroot kmod cpio xz-utils

      - name: Build and install pahole
        run: |
          git clone --branch v1.31 --depth=1 --recurse-submodules https://github.com/acmel/dwarves.git "$RUNNER_TEMP/dwarves"
          cmake -S "$RUNNER_TEMP/dwarves" -B "$RUNNER_TEMP/dwarves/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build "$RUNNER_TEMP/dwarves/build" --parallel "$(nproc)"
          sudo cmake --install "$RUNNER_TEMP/dwarves/build"
          pahole --version

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Download Linux Kernel Source
        run: |
          echo "⌛ Downloading Linux Kernel Source Code for ${{ needs.prepare.outputs.kernel_version }}..."
          wget https://cdn.kernel.org/pub/linux/kernel/v${{ needs.prepare.outputs.kernel_major_version }}.x/linux-${{ needs.prepare.outputs.kernel_version }}.tar.xz
          tar -xf linux-${{ needs.prepare.outputs.kernel_version }}.tar.xz
          rm linux-${{ needs.prepare.outputs.kernel_version }}.tar.xz
          mv linux-${{ needs.prepare.outputs.kernel_version }} linux
          echo "✅ Downloaded Linux Kernel Source Code for ${{ needs.prepare.outputs.kernel_version }}"
      - name: Download Debian Kernel Additional Source
        run: |
          echo "⌛ Downloading Debian Kernel Additional Source..."
          git clone -b debian/${{ needs.prepare.outputs.kernel_version }}-1 --depth=1 https://salsa.debian.org/kernel-team/linux.git linux-debian
          echo "✅ Downloaded Debian Kernel Additional Source"
      - name: Download Xanmod Patches
        run: |
          echo "⌛ Downloading Xanmod Patches..."
          git clone --depth=1 https://gitlab.com/xanmod/linux-patches.git linux-xanmod-patches
          if [ "${{ needs.prepare.outputs.kernel_major_version }}.${{ needs.prepare.outputs.kernel_minor_version }}" = "6.18" ] && \
             dpkg --compare-versions "${{ needs.prepare.outputs.kernel_version }}" lt "6.18.33"; then
            XANMOD_REF="0bc9e62789c65ae9b2cf8910773f892a51d9e896"
            echo "⭕ Pinning Xanmod patches to $XANMOD_REF for pre-6.18.33 kernels"
            git -C linux-xanmod-patches fetch --depth=1 origin "$XANMOD_REF"
            git -C linux-xanmod-patches checkout --detach FETCH_HEAD
          fi
          XANMOD_FIX_DIR="xanmod_patch_fixes/${{ needs.prepare.outputs.kernel_major_version }}.${{ needs.prepare.outputs.kernel_minor_version }}"
          if [ -d "$XANMOD_FIX_DIR" ]; then
            for fix_patch in "$XANMOD_FIX_DIR"/*.patch; do
              [ -e "$fix_patch" ] || continue
              echo "⭕ Applying local Xanmod patch fix: $fix_patch"
              patch -d linux-xanmod-patches -p1 < "$fix_patch"
            done
          fi
          echo "✅ Downloaded Xanmod Patches"
      - name: Organize Patches
        run: |
          echo "⌛ Organizing Patches..."
          cd linux
          cp -R ../linux-debian/debian/patches ./patches
          echo "⭕ Copied Debian Patches"
          XANMOD_NET_DIR="../linux-xanmod-patches/linux-${{ needs.prepare.outputs.kernel_major_version }}.${{ needs.prepare.outputs.kernel_minor_version }}.y-xanmod/net"
          if [ ! -d "$XANMOD_NET_DIR" ]; then
            XANMOD_NET_DIR="../linux-xanmod-patches/eol/linux-${{ needs.prepare.outputs.kernel_major_version }}.${{ needs.prepare.outputs.kernel_minor_version }}.y-xanmod/net"
          fi
          if [ ! -d "$XANMOD_NET_DIR" ]; then
            echo "❌ Xanmod net patch directory not found for ${{ needs.prepare.outputs.kernel_major_version }}.${{ needs.prepare.outputs.kernel_minor_version }}"
            exit 1
          fi
          cp -R "$XANMOD_NET_DIR" ./patches/net
          echo "⭕ Copied Xanmod Net Patches"
          cp -R ../kernel_patches/${{ needs.prepare.outputs.kernel_major_version }}.${{ needs.prepare.outputs.kernel_minor_version }} ./patches/custom
          cd patches
          {
            echo "# Net Patches from Xanmod"
            find ./net -type f -name "*.patch" -printf "net/%P\n" | sort
            echo "# Custom Patches"
            find ./custom -type f -name "*.patch" -printf "custom/%P\n" | sort
          } >> series
          echo "✅ All Patches Organized"
      - name: Apply Patches
        run: |
          echo "⌛ Applying Patches..."
          cd linux
          quilt push -a
          echo "✅ All Patches Applied"
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-${{ needs.prepare.outputs.kernel_major_version }}.${{ needs.prepare.outputs.kernel_minor_version }}-${{ needs.prepare.outputs.debian_arch }}
      - name: Configure Kernel Build
        run: |
          echo "⌛ Configuring Kernel Build..."
          cd linux
          bash ../.github/scripts/apply_config.sh "${{ needs.prepare.outputs.kernel_major_version }}.${{ needs.prepare.outputs.kernel_minor_version }}" "${{ needs.prepare.outputs.arch }}"
          echo "⭕ Merged Debian cloud-${{ needs.prepare.outputs.debian_arch }} base config with custom overrides"
          make CC="ccache gcc" HOSTCC="ccache gcc" olddefconfig
          echo "✅ Final Kernel Build Configured for ${{ needs.prepare.outputs.arch }}"
      - name: Build Kernel (Debian Package)
        env:
          KBUILD_BUILD_USER: "cloudpassenger"
          KBUILD_BUILD_HOST: "github-actions"
          KBUILD_BUILD_TIMESTAMP: ""
          KDEB_COMPRESS: "xz"
        run: |
          echo "⌛ Start Building Kernel (Debian Package) for ${{ needs.prepare.outputs.arch }}..."
          cd linux
          make -j "$(nproc)" CC="ccache gcc" HOSTCC="ccache gcc" bindeb-pkg
          echo "✅ Kernel (Debian Package) Built Successfully"
          cp .config ../linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}.config
          echo "✅ Copied Kernel Config"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ needs.prepare.outputs.arch }}
          path: |
            *.deb
            *.changes
            *.buildinfo
            *.config
      - name: Get build time
        id: get_build_time
        run: |
          BUILD_TIMESTAMP=$(date -Is)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=$BUILD_TIMESTAMP"
          echo "🏷️ Build Time: $BUILD_TIMESTAMP"

  create-release:
    name: Create Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifacts for ${{ needs.prepare.outputs.arch }}
        uses: actions/download-artifact@v4
        with:
          name: kernel-${{ needs.prepare.outputs.arch }}
          path: ./
      - name: Remove Debug Package in Release
        run: |
          rm -f linux-image-*-dbg_*.deb
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.kernel_version }}${{ needs.prepare.outputs.tag_suffix }}
          name: Debian Cloud Kernel ${{ needs.prepare.outputs.kernel_version }} with BBR3 (${{ needs.prepare.outputs.debian_arch }})
          body: |
            🚀 **Kernel Version:** `${{ needs.prepare.outputs.kernel_version }}`

            📅 **Build Time:** `${{ needs.build.outputs.build_time }}`

            🛠️ **Build Information:**
            - **Architecture:** `${{ needs.prepare.outputs.debian_arch }}`
            - **Kernel Type:** `cloud`
            - **Applied Patches:**
              - `Debian Patches Collection` (from [kernel-team/linux](https://salsa.debian.org/kernel-team/linux/))
              - `BBR V3` (from [xanmod/linux-patches](https://gitlab.com/xanmod/linux-patches))
              - `BBRPlus` (modified from [UJX6N/bbrplus-6.x_stable](https://github.com/UJX6N/bbrplus-6.x_stable))
              - `TCP Brutal` (from [apernet/tcp-brutal](https://github.com/apernet/tcp-brutal))
            
            --------
            
            🚀 **内核版本:** `${{ needs.prepare.outputs.kernel_version }}`

            📅 **构建时间:** `${{ needs.build.outputs.build_time }}`

            🛠️ **构建信息:**
            - **架构:** `${{ needs.prepare.outputs.debian_arch }}`
            - **内核类型:** `cloud`
            - **应用补丁:**
              - `Debian 补丁集合` (来自 [kernel-team/linux](https://salsa.debian.org/kernel-team/linux/))
              - `BBR V3` (来自 [xanmod/linux-patches](https://gitlab.com/xanmod/linux-patches))
              - `BBRPlus` (修改自 [UJX6N/bbrplus-6.x_stable](https://github.com/UJX6N/bbrplus-6.x_stable))
              - `TCP Brutal` (来自 [apernet/tcp-brutal](https://github.com/apernet/tcp-brutal))
          files: |
            *.deb
            *.changes
            *.buildinfo
            *.config
