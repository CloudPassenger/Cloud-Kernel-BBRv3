name: Build Cloud Kernel Packages

run-name: >-
  ${{ format('Build Cloud Kernel {0} ({1}){2}',
  github.event.client_payload.kernel_version || inputs.kernel_version,
  (github.event.action == 'trigger-x86_64-build' && 'x86_64') || (github.event.action == 'trigger-arm64-build' && 'arm64') || inputs.arch,
  (github.event.client_payload.diagnostic_build == true || github.event.client_payload.diagnostic_build == 'true' || inputs.diagnostic_build == 'true') && ' [diagnostic]' || '') }}

on:
  repository_dispatch:
    types: [trigger-x86_64-build, trigger-arm64-build]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Kernel version"
        required: true
        default: "6.12.30"
        type: string
      arch:
        description: "Target architecture"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - arm64
      localversion:
        description: "Kernel suffix (CONFIG_LOCALVERSION, leave empty to disable)"
        required: false
        default: "cloudy"
        type: string
      skip_cache:
        description: "Skip compiler caches"
        required: false
        default: false
        type: boolean
      diagnostic_build:
        description: "Enable verbose diagnostics for DEB, RPM, APK, and Arch builds"
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    name: Prepare Build Parameters
    runs-on: ubuntu-24.04
    outputs:
      kernel_version: ${{ steps.parameters.outputs.KERNEL_VERSION }}
      kernel_series: ${{ steps.parameters.outputs.KERNEL_SERIES }}
      kernel_major_version: ${{ steps.parameters.outputs.KERNEL_MAJOR_VERSION }}
      localversion: ${{ steps.parameters.outputs.LOCALVERSION }}
      localversion_display: ${{ steps.parameters.outputs.LOCALVERSION_DISPLAY }}
      skip_cache: ${{ steps.parameters.outputs.SKIP_CACHE }}
      diagnostic_build: ${{ steps.parameters.outputs.DIAGNOSTIC_BUILD }}
      arch: ${{ steps.parameters.outputs.ARCH }}
      debian_arch: ${{ steps.parameters.outputs.DEBIAN_ARCH }}
      rpm_arch: ${{ steps.parameters.outputs.RPM_ARCH }}
      alpine_arch: ${{ steps.parameters.outputs.ALPINE_ARCH }}
      runner: ${{ steps.parameters.outputs.RUNNER }}
      tag_suffix: ${{ steps.parameters.outputs.TAG_SUFFIX }}
    steps:
      - name: Prepare Build Parameters
        id: parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DISPATCH_VERSION: ${{ github.event.client_payload.kernel_version }}
          DISPATCH_LOCALVERSION: ${{ github.event.client_payload.localversion }}
          DISPATCH_DIAGNOSTIC: ${{ github.event.client_payload.diagnostic_build }}
          INPUT_VERSION: ${{ inputs.kernel_version }}
          INPUT_ARCH: ${{ inputs.arch }}
          INPUT_LOCALVERSION: ${{ inputs.localversion }}
          INPUT_SKIP_CACHE: ${{ inputs.skip_cache }}
          INPUT_DIAGNOSTIC: ${{ inputs.diagnostic_build }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            KERNEL_VERSION="$DISPATCH_VERSION"
            case "$EVENT_ACTION" in
              trigger-x86_64-build) ARCH=x86_64 ;;
              trigger-arm64-build) ARCH=arm64 ;;
              *)
                echo "Unknown repository_dispatch event type: $EVENT_ACTION" >&2
                exit 1
                ;;
            esac
            SKIP_CACHE=false
            DIAGNOSTIC_BUILD=${DISPATCH_DIAGNOSTIC:-false}
            LOCALVERSION=${DISPATCH_LOCALVERSION:-cloudy}
          else
            KERNEL_VERSION="$INPUT_VERSION"
            ARCH="$INPUT_ARCH"
            LOCALVERSION="$INPUT_LOCALVERSION"
            SKIP_CACHE="$INPUT_SKIP_CACHE"
            DIAGNOSTIC_BUILD="$INPUT_DIAGNOSTIC"
          fi

          if ! [[ "$KERNEL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid kernel version: $KERNEL_VERSION" >&2
            exit 1
          fi

          case "$DIAGNOSTIC_BUILD" in
            true|false) ;;
            *)
              echo "Invalid diagnostic build value: $DIAGNOSTIC_BUILD" >&2
              exit 1
              ;;
          esac
          LOCALVERSION=${LOCALVERSION#-}
          if [ -n "$LOCALVERSION" ] && ! printf '%s' "$LOCALVERSION" | grep -Eq '^[A-Za-z0-9._+-]+$'; then
            echo "Invalid localversion: $LOCALVERSION" >&2
            exit 1
          fi

          case "$SKIP_CACHE" in
            true|false) ;;
            *)
              echo "Invalid skip cache value: $SKIP_CACHE" >&2
              exit 1
              ;;
          esac
          case "$ARCH" in
            x86_64)
              DEBIAN_ARCH=amd64
              RPM_ARCH=x86_64
              ALPINE_ARCH=x86_64
              RUNNER=ubuntu-24.04
              TAG_SUFFIX=""
              ;;
            arm64)
              DEBIAN_ARCH=arm64
              RPM_ARCH=aarch64
              ALPINE_ARCH=aarch64
              RUNNER=ubuntu-24.04-arm
              TAG_SUFFIX=-arm64
              ;;
            *)
              echo "Unsupported architecture: $ARCH" >&2
              exit 1
              ;;
          esac
          KERNEL_SERIES=${KERNEL_VERSION%.*}
          KERNEL_MAJOR_VERSION=${KERNEL_VERSION%%.*}
          if [ -n "$LOCALVERSION" ]; then
            LOCALVERSION_DISPLAY="-$LOCALVERSION"
          else
            LOCALVERSION_DISPLAY="(none)"
          fi

          echo "Using kernel version: $KERNEL_VERSION"
          echo "Using kernel series: $KERNEL_SERIES"
          echo "Using architecture: $ARCH (Debian: $DEBIAN_ARCH, RPM: $RPM_ARCH, Alpine: $ALPINE_ARCH)"
          echo "Using kernel localversion: $LOCALVERSION_DISPLAY"
          echo "Using skip cache: $SKIP_CACHE"
          echo "Using diagnostic build: $DIAGNOSTIC_BUILD"
          {
            echo "KERNEL_VERSION=$KERNEL_VERSION"
            echo "KERNEL_SERIES=$KERNEL_SERIES"
            echo "KERNEL_MAJOR_VERSION=$KERNEL_MAJOR_VERSION"
            echo "LOCALVERSION=$LOCALVERSION"
            echo "LOCALVERSION_DISPLAY=$LOCALVERSION_DISPLAY"
            echo "SKIP_CACHE=$SKIP_CACHE"
            echo "DIAGNOSTIC_BUILD=$DIAGNOSTIC_BUILD"
            echo "ARCH=$ARCH"
            echo "DEBIAN_ARCH=$DEBIAN_ARCH"
            echo "RPM_ARCH=$RPM_ARCH"
            echo "ALPINE_ARCH=$ALPINE_ARCH"
            echo "RUNNER=$RUNNER"
            echo "TAG_SUFFIX=$TAG_SUFFIX"
          } >> "$GITHUB_OUTPUT"

  prepare-source:
    name: Prepare Patched Source for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: prepare
    steps:
      - name: Install Source Preparation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl git jq patch quilt bison bc flex rsync cmake pkg-config \
            libncurses-dev libdw-dev libelf-dev zlib1g-dev dpkg-dev xz-utils zstd

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Build and Install Pahole
        run: sudo bash .github/scripts/build_pahole.sh "$RUNNER_TEMP/dwarves-v1.31"

      - name: Prepare Shared Kernel Source
        env:
          KERNEL_LOCALVERSION: ${{ needs.prepare.outputs.localversion }}
        run: |
          bash .github/scripts/prepare_kernel_source.sh \
            "${{ needs.prepare.outputs.kernel_version }}" \
            "${{ needs.prepare.outputs.arch }}" \
            "$RUNNER_TEMP/kernel-work"

      - name: Create Prepared Source Archive
        run: |
          tar --zstd -cf prepared-kernel.tar.zst \
            -C "$RUNNER_TEMP/kernel-work" linux
          cp "$RUNNER_TEMP/kernel-work/build-manifest.json" .
          cp "$RUNNER_TEMP/kernel-work/linux/.config" \
            "linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}.config"

      - name: Upload Prepared Source
        uses: actions/upload-artifact@v7
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: |
            prepared-kernel.tar.zst
            build-manifest.json
            linux-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.debian_arch }}.config
          if-no-files-found: error
          retention-days: 3

      - name: Upload Release Manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ needs.prepare.outputs.arch }}
          path: build-manifest.json
          if-no-files-found: error

  build-kernel:
    name: Compile Kernel Once for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source]
    steps:
      - name: Install Kernel Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache cmake curl git patch jq openssl pkg-config quilt \
            libncurses-dev libssl-dev libelf-dev libdw-dev zlib1g-dev libudev-dev \
            libpci-dev libcap-dev libpcre2-dev libcurl4-openssl-dev bison bc flex \
            rsync kmod cpio xz-utils zstd

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Prepared Source
        uses: actions/download-artifact@v8
        with:
          name: prepared-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: prepared

      - name: Restore Kernel Compiler Cache
        if: needs.prepare.outputs.skip_cache != 'true'
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: kernel-${{ needs.prepare.outputs.kernel_series }}-${{ needs.prepare.outputs.debian_arch }}

      - name: Compile Kernel
        env:
          KBUILD_BUILD_USER: cloudpassenger
          KBUILD_BUILD_HOST: cloud-kernel-bbrv3
          KERNEL_LOCALVERSION: ${{ needs.prepare.outputs.localversion }}
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          run_kernel_build() {
            bash .github/scripts/build_kernel.sh \
              "${{ needs.prepare.outputs.kernel_version }}" \
              "${{ needs.prepare.outputs.arch }}" \
              prepared/prepared-kernel.tar.zst \
              dist/kernel
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_kernel_build
            exit 0
          fi

          diagnostic_dir=kernel-build-diagnostics
          mkdir -p "$diagnostic_dir"
          set +e
          run_kernel_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -nE 'BTF|pahole|resolve_btfids|FAILED|Failed|Error [0-9]+|Killed|out of memory' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            tail -n 500 "$diagnostic_dir/build.log"
            exit "$build_status"
          fi

      - name: Collect Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          mkdir -p kernel-build-diagnostics
          cp .build/kernel/${{ needs.prepare.outputs.arch }}/linux/.config \
            kernel-build-diagnostics/final.config 2>/dev/null || true
          cp .build/kernel/${{ needs.prepare.outputs.arch }}/linux/include/config/auto.conf \
            kernel-build-diagnostics/auto.conf 2>/dev/null || true
          ccache --show-stats > kernel-build-diagnostics/ccache.log 2>&1 || true
          if [ -f kernel-build-diagnostics/build.log ]; then
            zstd -T0 -10 --rm kernel-build-diagnostics/build.log
          fi

      - name: Upload Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Compiled Kernel
        uses: actions/upload-artifact@v7
        with:
          name: compiled-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: dist/kernel/compiled-kernel.tar.zst
          if-no-files-found: error
          retention-days: 3

  build-deb:
    name: Build Debian Packages for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source, build-kernel]
    outputs:
      build_time: ${{ steps.build_time.outputs.BUILD_TIMESTAMP }}
    steps:
      - name: Install Debian Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev pkg-config \
            kmod rsync cpio xz-utils dpkg-dev zstd

      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Compiled Kernel
        uses: actions/download-artifact@v8
        with:
          name: compiled-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: compiled

      - name: Build Debian Kernel Packages
        env:
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          run_deb_build() {
            bash .github/scripts/build_deb.sh \
              "${{ needs.prepare.outputs.kernel_version }}" \
              "${{ needs.prepare.outputs.arch }}" \
              generic \
              compiled/compiled-kernel.tar.zst \
              dist/deb/generic
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_deb_build
            exit 0
          fi

          diagnostic_dir=kernel-build-diagnostics/deb-generic
          mkdir -p "$diagnostic_dir"
          set +e
          run_deb_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            grep -nEi 'fatal|error:|failed|killed|no space|undefined reference' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            tail -n 500 "$diagnostic_dir/build.log"
            exit "$build_status"
          fi

      - name: Collect Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          diagnostic_dir=kernel-build-diagnostics/deb-generic
          mkdir -p "$diagnostic_dir"
          cp .build/deb/generic-${{ needs.prepare.outputs.arch }}/linux/.config \
            "$diagnostic_dir/final.config" 2>/dev/null || true
          for log in "$diagnostic_dir"/*.log; do
            [ -f "$log" ] || continue
            gzip -9 -f "$log"
          done

      - name: Upload Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-deb-generic-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/deb-generic/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Debian Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ needs.prepare.outputs.arch }}
          path: |
            dist/deb/generic/*.deb
            dist/deb/generic/*.config
          if-no-files-found: error

      - name: Record Build Time
        id: build_time
        run: |
          BUILD_TIMESTAMP=$(date -Is)
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"

  validate-deb:
    name: Validate DEB on ${{ matrix.name }} for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, build-deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 11
            image: debian:11-slim
          - name: Debian 12
            image: debian:12-slim
          - name: Debian 13
            image: debian:13-slim
          - name: Ubuntu 20.04
            image: ubuntu:20.04
          - name: Ubuntu 22.04
            image: ubuntu:22.04
          - name: Ubuntu 24.04
            image: ubuntu:24.04
    steps:
      - name: Checkout Installer Source Code
        uses: actions/checkout@v7

      - name: Download Debian Packages
        uses: actions/download-artifact@v8
        with:
          name: release-deb-${{ needs.prepare.outputs.arch }}
          path: packages

      - name: Validate Installer Package Lifecycle
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --env DEBIAN_FRONTEND=noninteractive \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              apt-get update
              /workspace/.github/scripts/test_install_kernel_deb.sh /workspace/packages
            '

  build-rpm:
    name: Build Generic RPMs for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source, build-kernel]
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Compiled Kernel
        uses: actions/download-artifact@v8
        with:
          name: compiled-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: compiled

      - name: Build Generic RPM Packages
        env:
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          run_rpm_build() {
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              --env DIAGNOSTIC_BUILD="$DIAGNOSTIC_BUILD" \
              rockylinux:9 \
              bash .github/scripts/build_rpm.sh \
                "${{ needs.prepare.outputs.kernel_version }}" \
                "${{ needs.prepare.outputs.arch }}" \
                generic \
                compiled/compiled-kernel.tar.zst \
                dist/rpm/generic
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_rpm_build
            exit 0
          fi

          diagnostic_dir=kernel-build-diagnostics/rpm-generic
          mkdir -p "$diagnostic_dir"
          set +e
          run_rpm_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::group::RPM build diagnostics"
            grep -nEi 'BTF|pahole|fatal|error:|failed|killed|no space|undefined reference' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            echo "::endgroup::"
            echo "::group::Last 500 RPM build log lines"
            tail -n 500 "$diagnostic_dir/build.log"
            echo "::endgroup::"
            exit "$build_status"
          fi

      - name: Collect RPM Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          diagnostic_dir=kernel-build-diagnostics/rpm-generic
          mkdir -p "$diagnostic_dir"
          {
            date -Is
            uname -a
            echo "CPU count: $(nproc)"
            free -h
            df -h
            docker version
            docker image inspect rockylinux:9 --format '{{json .RepoDigests}}' || true
          } > "$diagnostic_dir/environment.log" 2>&1
          cp packaging/rpm/kernel-cloud-bbrv3.spec "$diagnostic_dir/" 2>/dev/null || true
          cp ".build/rpm/generic-${{ needs.prepare.outputs.arch }}/linux/.config" \
            "$diagnostic_dir/final.config" 2>/dev/null || true
          cp ".build/rpm/generic-${{ needs.prepare.outputs.arch }}/rpmbuild.log" \
            "$diagnostic_dir/rpmbuild.log" 2>/dev/null || true
          for log in "$diagnostic_dir"/*.log; do
            [ -f "$log" ] || continue
            gzip -9 -f "$log"
          done

      - name: Upload RPM Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-rpm-generic-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/rpm-generic/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Generic RPM Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-rpm-generic-${{ needs.prepare.outputs.arch }}
          path: dist/rpm/generic/*.rpm
          if-no-files-found: error

  validate-rpm:
    name: Validate Generic RPM on ${{ matrix.name }} for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, build-rpm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora 43
            image: fedora:43
          - name: Fedora 44
            image: fedora:44
          - name: Enterprise Linux 9
            image: rockylinux:9
          - name: Enterprise Linux 10
            image: rockylinux/rockylinux:10
    steps:
      - name: Download Generic RPM Packages
        uses: actions/download-artifact@v8
        with:
          name: release-rpm-generic-${{ needs.prepare.outputs.arch }}
          path: packages

      - name: Validate Install and Remove Lifecycle
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/packages:/packages:ro" \
            --env KERNEL_VERSION="${{ needs.prepare.outputs.kernel_version }}" \
            "${{ matrix.image }}" \
            bash -euxo pipefail -c '
              main_rpm=$(find /packages -name "kernel-cloud-bbrv3-[0-9]*.rpm" -print -quit)
              devel_rpm=$(find /packages -name "kernel-cloud-bbrv3-devel-*.rpm" -print -quit)
              [ -n "$main_rpm" ]
              [ -n "$devel_rpm" ]

              dnf -y --setopt=install_weak_deps=False install "$main_rpm"
              set -- /lib/modules/"$KERNEL_VERSION"*
              [ -d "$1" ]
              release=${1##*/}
              [ -f "/boot/vmlinuz-$release" ]
              [ -f "/boot/initramfs-$release.img" ]
              [ ! -e "/lib/modules/$release/build" ]
              ! rpm -q linux-firmware
              ! rpm -q gcc
              ! rpm -q make
              ! rpm -q perl

              dnf -y --setopt=install_weak_deps=False install "$devel_rpm"
              [ -L "/lib/modules/$release/build" ]
              [ -d "/usr/src/kernels/$release" ]
              rpm -q gcc make perl

              dnf -y --setopt=clean_requirements_on_remove=False remove \
                kernel-cloud-bbrv3-devel kernel-cloud-bbrv3
              [ ! -e "/lib/modules/$release" ]
              [ ! -e "/boot/vmlinuz-$release" ]
            '

  build-arch:
    name: Build Arch Linux Packages for x86_64
    if: needs.prepare.outputs.arch == 'x86_64'
    runs-on: ubuntu-24.04
    needs: [prepare, prepare-source, build-kernel]
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Compiled Kernel
        uses: actions/download-artifact@v8
        with:
          name: compiled-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: compiled

      - name: Build Arch Linux Packages
        env:
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
        run: |
          run_arch_build() {
            docker run --rm \
              --volume "$GITHUB_WORKSPACE:/workspace" \
              --workdir /workspace \
              --env DIAGNOSTIC_BUILD="$DIAGNOSTIC_BUILD" \
              archlinux:base-devel \
              bash .github/scripts/build_arch.sh \
                "${{ needs.prepare.outputs.kernel_version }}" \
                x86_64 \
                generic \
                compiled/compiled-kernel.tar.zst \
                dist/arch/generic
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_arch_build
            exit 0
          fi

          diagnostic_dir=kernel-build-diagnostics/arch-generic
          mkdir -p "$diagnostic_dir"
          set +e
          run_arch_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::group::Arch build diagnostics"
            grep -nEi 'BTF|pahole|fatal|error:|failed|killed|no space|undefined reference' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            echo "::endgroup::"
            echo "::group::Last 500 Arch build log lines"
            tail -n 500 "$diagnostic_dir/build.log"
            echo "::endgroup::"
            exit "$build_status"
          fi

      - name: Collect Arch Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          diagnostic_dir=kernel-build-diagnostics/arch-generic
          mkdir -p "$diagnostic_dir"
          {
            date -Is
            uname -a
            echo "CPU count: $(nproc)"
            free -h
            df -h
            docker version
            docker image inspect archlinux:base-devel --format '{{json .RepoDigests}}' || true
          } > "$diagnostic_dir/environment.log" 2>&1
          cp packaging/arch/PKGBUILD.in "$diagnostic_dir/" 2>/dev/null || true
          cp .build/arch/generic-x86_64/package/PKGBUILD \
            "$diagnostic_dir/generated.PKGBUILD" 2>/dev/null || true
          cp .build/arch/generic-x86_64/package/src/linux/.config \
            "$diagnostic_dir/final.config" 2>/dev/null || true
          for log in "$diagnostic_dir"/*.log; do
            [ -f "$log" ] || continue
            gzip -9 -f "$log"
          done

      - name: Upload Arch Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-arch-generic-${{ needs.prepare.outputs.kernel_version }}-x86_64
          path: kernel-build-diagnostics/arch-generic/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Arch Linux Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-arch-generic-x86_64
          path: dist/arch/generic/*.pkg.tar.zst
          if-no-files-found: error

  validate-arch:
    name: Validate Arch Linux Packages for x86_64
    if: needs.prepare.outputs.arch == 'x86_64'
    runs-on: ubuntu-24.04
    needs: [prepare, build-arch]
    steps:
      - name: Download Arch Linux Packages
        uses: actions/download-artifact@v8
        with:
          name: release-arch-generic-x86_64
          path: packages

      - name: Validate Install and Remove Lifecycle
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/packages:/packages:ro" \
            archlinux:base-devel \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm --needed mkinitcpio
              runtime_pkg=$(find /packages -name "linux-cloud-bbrv3-[0-9]*.pkg.tar.zst" -print -quit)
              headers_pkg=$(find /packages -name "linux-cloud-bbrv3-headers-*.pkg.tar.zst" -print -quit)
              [ -n "$runtime_pkg" ]
              [ -n "$headers_pkg" ]

              pacman -U --noconfirm "$runtime_pkg" 2>&1 | tee /tmp/runtime-install.log
              ! grep -Eq "ERROR:|command failed|image may not be complete" /tmp/runtime-install.log
              modules_dir=$(dirname "$(find /usr/lib/modules -mindepth 2 -maxdepth 2 \
                -name pkgbase -exec grep -lx linux-cloud-bbrv3 {} \; | head -n 1)")
              release=${modules_dir##*/}
              [ -n "$release" ]
              [ -f "$modules_dir/vmlinuz" ]
              [ ! -e "$modules_dir/build" ]
              [ ! -e /usr/src/linux-cloud-bbrv3 ]
              [ -f /etc/mkinitcpio.d/linux-cloud-bbrv3.preset ]
              [ -f /etc/mkinitcpio-linux-cloud-bbrv3.conf ]
              [ -f /boot/vmlinuz-linux-cloud-bbrv3 ]
              [ -s /boot/initramfs-linux-cloud-bbrv3.img ]

              pacman -U --noconfirm "$headers_pkg"
              [ -d "$modules_dir/build" ]
              [ -L /usr/src/linux-cloud-bbrv3 ]

              pacman -Rns --noconfirm linux-cloud-bbrv3-headers linux-cloud-bbrv3
              [ ! -e "$modules_dir" ]
              [ ! -e /boot/vmlinuz-linux-cloud-bbrv3 ]
              [ ! -e /boot/initramfs-linux-cloud-bbrv3.img ]
            '

  build-apk:
    name: Build Generic Alpine APKs for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, prepare-source, build-kernel]
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'release-signing' || 'build-testing' }}
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Compiled Kernel
        uses: actions/download-artifact@v8
        with:
          name: compiled-kernel-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: compiled

      - name: Build Generic APK Packages
        env:
          APK_SIGNING_PRIVATE_KEY_B64: ${{ secrets.APK_SIGNING_PRIVATE_KEY_B64 }}
          DIAGNOSTIC_BUILD: ${{ needs.prepare.outputs.diagnostic_build }}
          REQUIRE_PERSISTENT_SIGNING: ${{ github.ref == 'refs/heads/main' }}
        run: |
          signing_dir="$RUNNER_TEMP/cloud-kernel-apk-signing"
          mkdir -p "$signing_dir"
          chmod 700 "$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT

          private_key_path=""
          if [ -n "$APK_SIGNING_PRIVATE_KEY_B64" ]; then
            private_key_path="$signing_dir/cloud-kernel-bbrv3.rsa"
            printf '%s' "$APK_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$private_key_path"
            chmod 600 "$private_key_path"
          fi

          run_apk_build() {
            docker_args=(
              --rm
              --volume "$GITHUB_WORKSPACE:/workspace"
              --workdir /workspace
              --env DIAGNOSTIC_BUILD="$DIAGNOSTIC_BUILD"
              --env REQUIRE_PERSISTENT_SIGNING="$REQUIRE_PERSISTENT_SIGNING"
            )
            if [ -n "$private_key_path" ]; then
              docker_args+=(
                --volume "$private_key_path:/run/secrets/cloud-kernel-bbrv3.rsa:ro"
                --env APK_SIGNING_PRIVATE_KEY_FILE=/run/secrets/cloud-kernel-bbrv3.rsa
              )
            fi

            docker run "${docker_args[@]}" \
              alpine:3.21 \
              sh -c 'apk add --no-cache bash coreutils && exec bash .github/scripts/build_apk.sh "$@"' -- \
                "${{ needs.prepare.outputs.kernel_version }}" \
                "${{ needs.prepare.outputs.arch }}" \
                generic \
                compiled/compiled-kernel.tar.zst \
                dist/apk/generic
          }

          if [ "$DIAGNOSTIC_BUILD" != "true" ]; then
            run_apk_build
            exit 0
          fi

          diagnostic_dir=kernel-build-diagnostics/apk-generic
          mkdir -p "$diagnostic_dir"
          set +e
          run_apk_build > "$diagnostic_dir/build.log" 2>&1
          build_status=$?
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "::group::APK build diagnostics"
            grep -nEi 'BTF|pahole|fatal|error:|failed|killed|no space|undefined reference|untrusted' \
              "$diagnostic_dir/build.log" | tail -n 200 || true
            echo "::endgroup::"
            echo "::group::Last 500 APK build log lines"
            tail -n 500 "$diagnostic_dir/build.log"
            echo "::endgroup::"
            exit "$build_status"
          fi

      - name: Collect APK Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        run: |
          diagnostic_dir=kernel-build-diagnostics/apk-generic
          mkdir -p "$diagnostic_dir"
          {
            date -Is
            uname -a
            echo "CPU count: $(nproc)"
            free -h
            df -h
            docker version
            docker image inspect alpine:3.21 --format '{{json .RepoDigests}}' || true
          } > "$diagnostic_dir/environment.log" 2>&1
          cp packaging/apk/APKBUILD.in "$diagnostic_dir/" 2>/dev/null || true
          cp ".build/apk/generic-${{ needs.prepare.outputs.arch }}/aports/testing/linux-cloud-bbrv3/APKBUILD" \
            "$diagnostic_dir/generated.APKBUILD" 2>/dev/null || true
          cp ".build/apk/generic-${{ needs.prepare.outputs.arch }}/aports/testing/linux-cloud-bbrv3/src/linux/.config" \
            "$diagnostic_dir/final.config" 2>/dev/null || true
          for log in "$diagnostic_dir"/*.log; do
            [ -f "$log" ] || continue
            gzip -9 -f "$log"
          done

      - name: Upload APK Build Diagnostics
        if: always() && needs.prepare.outputs.diagnostic_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kernel-build-diagnostics-apk-generic-${{ needs.prepare.outputs.kernel_version }}-${{ needs.prepare.outputs.arch }}
          path: kernel-build-diagnostics/apk-generic/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Generic APK Packages
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-generic-${{ needs.prepare.outputs.arch }}
          path: |
            dist/apk/generic/*.apk
            dist/apk/generic/*.rsa.pub
          if-no-files-found: error

  validate-apk:
    name: Validate Generic APK on Alpine ${{ matrix.version }} for ${{ needs.prepare.outputs.arch }}
    runs-on: ${{ needs.prepare.outputs.runner }}
    needs: [prepare, build-apk]
    strategy:
      fail-fast: false
      matrix:
        version: ['3.21', '3.22', '3.23', '3.24']
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7

      - name: Download Generic APK Packages
        uses: actions/download-artifact@v8
        with:
          name: release-apk-generic-${{ needs.prepare.outputs.arch }}
          path: packages

      - name: Validate Installer Lifecycle and Dependencies
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/packages:/packages:ro" \
            alpine:${{ matrix.version }} \
            sh -euxc '
              apk update
              apk add bash linux-firmware-none mkinitfs

              if [ "$(apk --print-arch)" = x86_64 ]; then
                apk add syslinux
                sed -i "s/^default=.*/default=virt/; s|^root=.*|root=/dev/vda3|" \
                  /etc/update-extlinux.conf
              fi

              bash /workspace/.github/scripts/test_install_kernel_apk.sh /packages
            '

      - name: Validate Installer Bootloader Integration
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            alpine:${{ matrix.version }} \
            sh -euxc '
              apk add --no-cache bash
              bash /workspace/.github/scripts/test_install_kernel_bootloaders.sh
            '

  create-release:
    name: Create Multi-Format Release
    needs: [prepare, build-deb, validate-deb, build-rpm, validate-rpm, build-apk, validate-apk, build-arch, validate-arch]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.prepare.result == 'success' &&
      needs.build-deb.result == 'success' &&
      needs.validate-deb.result == 'success' &&
      needs.build-rpm.result == 'success' &&
      needs.validate-rpm.result == 'success' &&
      needs.build-apk.result == 'success' &&
      needs.validate-apk.result == 'success' &&
      (needs.prepare.outputs.arch != 'x86_64' ||
        (needs.build-arch.result == 'success' && needs.validate-arch.result == 'success'))
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - name: Checkout Workflow Source Code
        uses: actions/checkout@v7
      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-${{ needs.prepare.outputs.arch }}
          path: release-assets
          merge-multiple: true

      - name: Sign Release Assets
        env:
          PACKAGE_SIGNING_GPG_FINGERPRINT: ${{ vars.PACKAGE_SIGNING_GPG_FINGERPRINT }}
          PACKAGE_SIGNING_GPG_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_GPG_PASSPHRASE }}
          PACKAGE_SIGNING_GPG_PRIVATE_KEY_B64: ${{ secrets.PACKAGE_SIGNING_GPG_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$PACKAGE_SIGNING_GPG_PRIVATE_KEY_B64" ]; then
            echo "PACKAGE_SIGNING_GPG_PRIVATE_KEY_B64 is not configured" >&2
            exit 1
          fi
          if [ -z "$PACKAGE_SIGNING_GPG_FINGERPRINT" ]; then
            echo "PACKAGE_SIGNING_GPG_FINGERPRINT is not configured" >&2
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y gnupg rpm

          signing_dir="$RUNNER_TEMP/cloud-kernel-release-signing"
          mkdir -p "$signing_dir"
          chmod 700 "$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT

          private_key="$signing_dir/openpgp-private-key.asc"
          printf '%s' "$PACKAGE_SIGNING_GPG_PRIVATE_KEY_B64" \
            | base64 --decode > "$private_key"
          chmod 600 "$private_key"

          signing_args=(
            release-assets
            "$private_key"
            "$PACKAGE_SIGNING_GPG_FINGERPRINT"
          )
          if [ -n "$PACKAGE_SIGNING_GPG_PASSPHRASE" ]; then
            passphrase_file="$signing_dir/openpgp-passphrase"
            printf '%s' "$PACKAGE_SIGNING_GPG_PASSPHRASE" > "$passphrase_file"
            chmod 600 "$passphrase_file"
            signing_args+=("$passphrase_file")
          fi

          .github/scripts/sign_release_assets.sh "${signing_args[@]}"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.kernel_version }}${{ needs.prepare.outputs.tag_suffix }}
          name: Cloud Kernel ${{ needs.prepare.outputs.kernel_version }} with BBRv3 (${{ needs.prepare.outputs.arch }})
          body: |
            ## English

            **Kernel version:** `${{ needs.prepare.outputs.kernel_version }}`

            **Build time:** `${{ needs.build-deb.outputs.build_time }}`

            **Build information:**
            - **Architecture:** `${{ needs.prepare.outputs.arch }}`
            - **Kernel type:** `cloud`
            - **Kernel suffix (LOCALVERSION):** `${{ needs.prepare.outputs.localversion_display }}`
            - **Package targets:** Debian/Ubuntu `.deb`, generic Fedora/Enterprise Linux `.rpm`, generic Alpine Linux `.apk`, and Arch Linux `.pkg.tar.zst` (x86_64 only)
            - **Validated targets:** Fedora 43/44, Enterprise Linux 9/10, Alpine Linux 3.21/3.22/3.23/3.24, and Arch Linux x86_64
            - **OpenPGP signing fingerprint:** `${{ vars.PACKAGE_SIGNING_GPG_FINGERPRINT }}`
            - **Signature files:** native RPM signatures, Arch package `.sig` files, `SHA256SUMS`, `SHA256SUMS.asc`, and `cloud-kernel-signing.asc`
            - **Applied patches:**
              - `Debian Patches Collection` (from [kernel-team/linux](https://salsa.debian.org/kernel-team/linux/))
              - `BBR V3` (from [xanmod/linux-patches](https://gitlab.com/xanmod/linux-patches))
              - `BBRPlus` (modified from [UJX6N/bbrplus-6.x_stable](https://github.com/UJX6N/bbrplus-6.x_stable))
              - `TCP Brutal` (from [apernet/tcp-brutal](https://github.com/apernet/tcp-brutal))

            **Important:** Secure Boot is not currently supported. Keep the distribution kernel installed as a recovery option. This VPS configuration disables USB/HID, so Arch Linux `mkinitcpio` may warn that `usbhid` is missing; do not use this kernel where boot-time USB keyboard input is required.

            ```bash
            # Debian / Ubuntu
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb

            # Fedora / Enterprise Linux
            sudo dnf install ./kernel-cloud-bbrv3-[0-9]*.rpm ./kernel-cloud-bbrv3-devel-*.rpm

            # Alpine Linux
            sudo cp ./*.rsa.pub /etc/apk/keys/
            sudo apk add ./linux-cloud-bbrv3-[0-9]*.apk ./linux-cloud-bbrv3-dev-*.apk

            # Arch Linux (x86_64 only)
            sudo pacman -Syu
            sudo pacman -U ./linux-cloud-bbrv3-[0-9]*.pkg.tar.zst ./linux-cloud-bbrv3-headers-*.pkg.tar.zst
            ```

            ---

            ## 中文

            **内核版本：** `${{ needs.prepare.outputs.kernel_version }}`

            **构建时间：** `${{ needs.build-deb.outputs.build_time }}`

            **构建信息：**
            - **架构：** `${{ needs.prepare.outputs.arch }}`
            - **内核类型：** `cloud`
            - **内核后缀 (LOCALVERSION)：** `${{ needs.prepare.outputs.localversion_display }}`
            - **软件包目标：** Debian/Ubuntu `.deb`、通用 Fedora/Enterprise Linux `.rpm`、通用 Alpine Linux `.apk`，以及 Arch Linux `.pkg.tar.zst`（仅 x86_64）
            - **验证目标：** Fedora 43/44、Enterprise Linux 9/10、Alpine Linux 3.21/3.22/3.23/3.24，以及 Arch Linux x86_64
            - **OpenPGP 签名指纹：** `${{ vars.PACKAGE_SIGNING_GPG_FINGERPRINT }}`
            - **签名文件：** RPM 原生签名、Arch 软件包 `.sig`、`SHA256SUMS`、`SHA256SUMS.asc` 和 `cloud-kernel-signing.asc`
            - **应用补丁：**
              - `Debian 补丁集合`（来自 [kernel-team/linux](https://salsa.debian.org/kernel-team/linux/)）
              - `BBR V3`（来自 [xanmod/linux-patches](https://gitlab.com/xanmod/linux-patches)）
              - `BBRPlus`（修改自 [UJX6N/bbrplus-6.x_stable](https://github.com/UJX6N/bbrplus-6.x_stable)）
              - `TCP Brutal`（来自 [apernet/tcp-brutal](https://github.com/apernet/tcp-brutal)）

            **重要提示：** 当前不支持 Secure Boot。请保留发行版原有内核作为恢复选项。本 VPS 配置禁用了 USB/HID，因此 Arch Linux `mkinitcpio` 可能提示缺少 `usbhid`；需要在启动阶段使用 USB 键盘输入的机器不应使用此内核。

            ```bash
            # Debian / Ubuntu
            sudo dpkg -i linux-image-*.deb linux-headers-*.deb

            # Fedora / Enterprise Linux
            sudo dnf install ./kernel-cloud-bbrv3-[0-9]*.rpm ./kernel-cloud-bbrv3-devel-*.rpm

            # Alpine Linux
            sudo cp ./*.rsa.pub /etc/apk/keys/
            sudo apk add ./linux-cloud-bbrv3-[0-9]*.apk ./linux-cloud-bbrv3-dev-*.apk

            # Arch Linux（仅 x86_64）
            sudo pacman -Syu
            sudo pacman -U ./linux-cloud-bbrv3-[0-9]*.pkg.tar.zst ./linux-cloud-bbrv3-headers-*.pkg.tar.zst
            ```
          files: |
            release-assets/*.deb
            release-assets/*.config
            release-assets/*.json
            release-assets/*.rpm
            release-assets/*.apk
            release-assets/*.pkg.tar.zst
            release-assets/*.sig
            release-assets/*.rsa.pub
            release-assets/*.asc
            release-assets/SHA256SUMS
